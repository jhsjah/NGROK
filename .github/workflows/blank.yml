name: RDP-ngrok

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-ngrok" 2>$null
          netsh advfirewall firewall add rule name="RDP-ngrok" dir=in action=allow protocol=TCP localport=3389
          Restart-Service TermService -Force

      - name: Create RDP User
        run: |
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }
          $raw = @()
          $raw += $charSet.Upper | Get-Random -Count 4
          $raw += $charSet.Lower | Get-Random -Count 4
          $raw += $charSet.Number | Get-Random -Count 4
          $raw += $charSet.Special | Get-Random -Count 4
          $password = -join ($raw | Sort-Object {Get-Random})
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "RDP" -Confirm:$false
          }

          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "RDP user created"

      - name: Install ngrok
        run: |
          $ngrokUrl = "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
          Invoke-WebRequest -Uri $ngrokUrl -OutFile "$env:TEMP\ngrok.zip"
          Expand-Archive -Path "$env:TEMP\ngrok.zip" -DestinationPath "$env:TEMP\ngrok" -Force
          Copy-Item "$env:TEMP\ngrok\ngrok.exe" -Destination "$env:TEMP\ngrok.exe" -Force

      - name: Start ngrok Tunnel
        run: |
          # Authenticate ngrok
          & "$env:TEMP\ngrok.exe" config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

          # Start TCP tunnel on port 3389 in background
          Start-Process -FilePath "$env:TEMP\ngrok.exe" -ArgumentList "tcp", "3389", "--log=stdout" -RedirectStandardOutput "$env:TEMP\ngrok.log" -NoNewWindow

          # Wait for tunnel to be ready
          Start-Sleep -Seconds 12

          # Get the public address
          $tunnelInfo = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
          $publicUrl = $tunnelInfo.tunnels[0].public_url

          if (-not $publicUrl) {
              Write-Error "Failed to get ngrok public URL"
              Get-Content "$env:TEMP\ngrok.log" -ErrorAction SilentlyContinue
              exit 1
          }

          # Convert tcp://0.tcp.ngrok.io:12345 → usable format
          $publicUrl = $publicUrl -replace "tcp://", ""
          "NGROK_ADDR=$publicUrl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ""
          Write-Host "========================================"
          Write-Host "          RDP ACCESS INFO"
          Write-Host "========================================"
          Write-Host "Address  : $publicUrl"
          Write-Host "Username : RDP"
          Write-Host "Password : $env:RDP_PASSWORD"
          Write-Host "========================================"
          Write-Host ""

      - name: Keep Alive
        run: |
          Write-Host "RDP is ready. Use the address above."
          Write-Host "Cancel this workflow when you are finished."
          while ($true) {
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Still running..."
              Start-Sleep -Seconds 300
          }
