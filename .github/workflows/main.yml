name: RDP-ngrok

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'RDP Password (leave empty for random)'
        required: false
        default: ''

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable and Configure RDP
        run: |
          Write-Host "=== Configuring RDP ===" -ForegroundColor Cyan

          # Enable RDP
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force

          # Disable NLA + Force SecurityLayer = RDP
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "SecurityLayer" -Value 0 -Force

          # Firewall
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          netsh advfirewall firewall delete rule name="Allow RDP" 2>$null
          netsh advfirewall firewall add rule name="Allow RDP" dir=in action=allow protocol=TCP localport=3389

          # Restart service
          Restart-Service TermService -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 10

          # Verify port
          $listening = netstat -an | Select-String ":3389.*LISTENING"
          if ($listening) {
            Write-Host "Port 3389 is listening" -ForegroundColor Green
          } else {
            Write-Host "WARNING: Port 3389 is NOT listening" -ForegroundColor Yellow
          }

      - name: Set runneradmin Password
        env:
          INPUT_PASSWORD: ${{ github.event.inputs.password }}
        run: |
          if ($env:INPUT_PASSWORD -and $env:INPUT_PASSWORD.Trim() -ne "") {
            $password = $env:INPUT_PASSWORD
            Write-Host "Using custom password"
          } else {
            $password = "Pass@" + (Get-Random -Minimum 100000 -Maximum 999999)
            Write-Host "Generated random password"
          }

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $securePass

          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Password set successfully"

      - name: Install ngrok
        run: |
          Write-Host "Downloading ngrok..." -ForegroundColor Cyan
          $ngrokUrl = "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
          Invoke-WebRequest -Uri $ngrokUrl -OutFile "$env:TEMP\ngrok.zip" -UseBasicParsing
          Expand-Archive "$env:TEMP\ngrok.zip" -DestinationPath "$env:TEMP" -Force
          Write-Host "ngrok installed"

      - name: Start ngrok + Show Credentials
        run: |
          & "$env:TEMP\ngrok.exe" config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

          Start-Process -FilePath "$env:TEMP\ngrok.exe" -ArgumentList "tcp","3389","--log=stdout" -WindowStyle Hidden

          Write-Host "Waiting for ngrok tunnel..." -ForegroundColor Yellow
          $maxTries = 15
          $addr = $null

          for ($i = 1; $i -le $maxTries; $i++) {
            Start-Sleep -Seconds 4
            try {
              $tunnels = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 5
              if ($tunnels.tunnels.Count -gt 0) {
                $addr = $tunnels.tunnels[0].public_url -replace "tcp://",""
                break
              }
            } catch {
              Write-Host "Attempt $i/$maxTries - tunnel not ready yet..."
            }
          }

          if (-not $addr) {
            Write-Error "Failed to get ngrok tunnel address"
            exit 1
          }

          Write-Host ""
          Write-Host "==============================================" -ForegroundColor Green
          Write-Host "              RDP DETAILS" -ForegroundColor Green
          Write-Host "==============================================" -ForegroundColor Green
          Write-Host "Address   : $addr"
          Write-Host "Username  : runneradmin"
          Write-Host "Password  : $env:RDP_PASSWORD"
          Write-Host "==============================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "Copy the Address above and connect with Remote Desktop" -ForegroundColor Cyan

      - name: Keep Alive
        run: |
          Write-Host "RDP is running. Do not cancel this workflow." -ForegroundColor Yellow
          while ($true) {
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Still active..."
            Start-Sleep -Seconds 300
          }          Write-Host "Address   : $addr"
          Write-Host "Username  : runneradmin"
          Write-Host "Password  : $env:RDP_PASSWORD"
          Write-Host "==============================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "Copy the Address above and connect with Remote Desktop" -ForegroundColor Cyan

      - name: Keep Alive
        run: |
          Write-Host "RDP is running. Do not cancel this workflow." -ForegroundColor Yellow
          Write-Host "Session will stay active for up to 6 hours." -ForegroundColor Yellow
          while ($true) {
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Still active..."
            Start-Sleep -Seconds 300
          }
