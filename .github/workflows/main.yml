name: RDP-ngrok

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. ENABLE AND CONFIGURE RDP
      # ============================================================
      - name: Enable and Configure RDP
        shell: powershell
        run: |

          Write-Host "=============================================="
          Write-Host "        ENABLING REMOTE DESKTOP"
          Write-Host "=============================================="

          # Enable RDP
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Keep normal Windows RDP security settings.
          # Do not disable NLA/security layer.

          # Enable built-in Remote Desktop firewall rules if available
          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          # Remove our custom rule if it already exists
          netsh advfirewall firewall delete rule name="Allow RDP 3389" 2>$null

          # Create explicit RDP firewall rule
          netsh advfirewall firewall add rule `
            name="Allow RDP 3389" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          # Restart RDP service
          Restart-Service TermService -Force

          Start-Sleep -Seconds 10

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        RDP SERVICE STATUS"
          Write-Host "=============================================="

          Get-Service TermService

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        RDP REGISTRY STATUS"
          Write-Host "=============================================="

          Get-ItemProperty `
            "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        RDP PORT 3389"
          Write-Host "=============================================="

          netstat -ano | findstr ":3389"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        LOCAL PORT TEST"
          Write-Host "=============================================="

          Test-NetConnection 127.0.0.1 -Port 3389


      # ============================================================
      # 2. SHOW FIREWALL CONFIGURATION
      # ============================================================
      - name: Show Windows Firewall Configuration
        shell: powershell
        run: |

          Write-Host "=============================================="
          Write-Host "        FIREWALL PROFILES"
          Write-Host "=============================================="

          Get-NetFirewallProfile |
            Format-Table `
              Name,
              Enabled,
              DefaultInboundAction,
              DefaultOutboundAction `
              -AutoSize

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        REMOTE DESKTOP FIREWALL RULES"
          Write-Host "=============================================="

          Get-NetFirewallRule |
            Where-Object {
              $_.DisplayName -like "*Remote Desktop*" -or
              $_.DisplayName -like "*RDP*"
            } |
            Format-Table `
              DisplayName,
              Enabled,
              Direction,
              Action `
              -AutoSize

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        TCP 3389 INBOUND RULES"
          Write-Host "=============================================="

          Get-NetFirewallRule |
            Where-Object {
              $_.Enabled -eq "True" -and
              $_.Direction -eq "Inbound"
            } |
            Get-NetFirewallPortFilter |
            Where-Object {
              $_.Protocol -eq "TCP" -and
              $_.LocalPort -eq "3389"
            } |
            Format-Table `
              Protocol,
              LocalPort `
              -AutoSize

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        NETSH FIREWALL STATUS"
          Write-Host "=============================================="

          netsh advfirewall show allprofiles


      # ============================================================
      # 3. SET RDP USER PASSWORD
      # ============================================================
      - name: Set runneradmin Password
        shell: powershell
        run: |

          $password = "Pass@" + `
            (Get-Random -Minimum 100000 -Maximum 999999)

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          Set-LocalUser `
            -Name "runneradmin" `
            -Password $securePass

          "RDP_PASSWORD=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Password set successfully"


      # ============================================================
      # 4. INSTALL NGROK
      # ============================================================
      - name: Install ngrok
        shell: powershell
        run: |

          Invoke-WebRequest `
            -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" `
            -OutFile "$env:TEMP\ngrok.zip"

          Expand-Archive `
            "$env:TEMP\ngrok.zip" `
            -DestinationPath "$env:TEMP" `
            -Force

          Write-Host "ngrok installed."


      # ============================================================
      # 5. START NGROK
      # ============================================================
      - name: Start ngrok + Show Credentials
        shell: powershell
        run: |

          & "$env:TEMP\ngrok.exe" `
            config add-authtoken `
            "${{ secrets.NGROK_AUTH_TOKEN }}"

          Write-Host "Starting ngrok..."

          Start-Process `
            -FilePath "$env:TEMP\ngrok.exe" `
            -ArgumentList "tcp","3389" `
            -WindowStyle Hidden

          Write-Host "Waiting for ngrok..."

          Start-Sleep -Seconds 20

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        NGROK STATUS"
          Write-Host "=============================================="

          try {

            $tunnels = Invoke-RestMethod `
              -Uri "http://127.0.0.1:4040/api/tunnels"

            if ($null -eq $tunnels.tunnels) {
              throw "No ngrok tunnels found."
            }

            if ($tunnels.tunnels.Count -eq 0) {
              throw "ngrok is running but no tunnel exists."
            }

            $addr = $tunnels.tunnels[0].public_url `
              -replace "tcp://",""

            Write-Host ""
            Write-Host "=============================================="
            Write-Host "              RDP DETAILS"
            Write-Host "=============================================="
            Write-Host ""
            Write-Host "Address  : $addr"
            Write-Host "Username : runneradmin"
            Write-Host "Password : $env:RDP_PASSWORD"
            Write-Host ""
            Write-Host "=============================================="
            Write-Host ""

          }
          catch {

            Write-Host ""
            Write-Host "=============================================="
            Write-Host "        NGROK ERROR"
            Write-Host "=============================================="
            Write-Host ""

            Write-Host $_

            Write-Host ""
            Write-Host "ngrok process:"
            Get-Process ngrok -ErrorAction SilentlyContinue

            Write-Host ""
            Write-Host "ngrok API:"
            try {
              Invoke-RestMethod `
                -Uri "http://127.0.0.1:4040/api/tunnels"
            }
            catch {
              Write-Host "ngrok API is not available."
            }

            exit 1
          }


      # ============================================================
      # 6. FINAL CONNECTIVITY CHECK
      # ============================================================
      - name: Final RDP Connectivity Check
        shell: powershell
        run: |

          Write-Host "=============================================="
          Write-Host "        FINAL RDP CHECK"
          Write-Host "=============================================="

          Write-Host ""
          Write-Host "TermService:"
          Get-Service TermService

          Write-Host ""
          Write-Host "Port 3389:"
          netstat -ano | findstr ":3389"

          Write-Host ""
          Write-Host "Local TCP test:"
          Test-NetConnection `
            127.0.0.1 `
            -Port 3389

          Write-Host ""
          Write-Host "Firewall rule:"
          netsh advfirewall firewall show rule `
            name="Allow RDP 3389"


      # ============================================================
      # 7. KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep Alive
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        RDP IS RUNNING"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Do not cancel the workflow."
          Write-Host ""

          while ($true) {

            Write-Host `
              "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP Active"

            Start-Sleep -Seconds 300
          }
