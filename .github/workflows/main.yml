name: RDP-ngrok

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. ENABLE AND CONFIGURE RDP
      # ============================================================
      - name: Enable and Configure RDP
        shell: powershell
        run: |

          Write-Host "=============================================="
          Write-Host "        ENABLING REMOTE DESKTOP"
          Write-Host "=============================================="

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Keep normal RDP security settings.
          # Do not disable NLA/security layer.

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          netsh advfirewall firewall delete rule `
            name="Allow RDP 3389" 2>$null

          netsh advfirewall firewall add rule `
            name="Allow RDP 3389" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service TermService -Force

          Start-Sleep -Seconds 10

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        RDP SERVICE STATUS"
          Write-Host "=============================================="

          Get-Service TermService

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        RDP REGISTRY STATUS"
          Write-Host "=============================================="

          Get-ItemProperty `
            "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        RDP PORT 3389"
          Write-Host "=============================================="

          netstat -ano | findstr ":3389"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        LOCAL PORT TEST"
          Write-Host "=============================================="

          Test-NetConnection 127.0.0.1 -Port 3389


      # ============================================================
      # 2. SHOW FIREWALL CONFIGURATION
      # ============================================================
      - name: Show Windows Firewall Configuration
        shell: powershell
        run: |

          Write-Host "=============================================="
          Write-Host "        FIREWALL PROFILES"
          Write-Host "=============================================="

          Get-NetFirewallProfile |
            Format-Table `
              Name,
              Enabled,
              DefaultInboundAction,
              DefaultOutboundAction `
              -AutoSize

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        REMOTE DESKTOP FIREWALL RULES"
          Write-Host "=============================================="

          Get-NetFirewallRule |
            Where-Object {
              $_.DisplayName -like "*Remote Desktop*" -or
              $_.DisplayName -like "*RDP*"
            } |
            Format-Table `
              DisplayName,
              Enabled,
              Direction,
              Action `
              -AutoSize

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        TCP 3389 INBOUND RULES"
          Write-Host "=============================================="

          Get-NetFirewallRule |
            Where-Object {
              $_.Enabled -eq "True" -and
              $_.Direction -eq "Inbound"
            } |
            Get-NetFirewallPortFilter |
            Where-Object {
              $_.Protocol -eq "TCP" -and
              $_.LocalPort -eq "3389"
            } |
            Format-Table `
              Protocol,
              LocalPort `
              -AutoSize

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        NETSH FIREWALL STATUS"
          Write-Host "=============================================="

          netsh advfirewall show allprofiles


      # ============================================================
      # 3. SET RDP USER PASSWORD
      # ============================================================
      - name: Set runneradmin Password
        shell: powershell
        run: |

          $password = "Pass@" + `
            (Get-Random -Minimum 100000 -Maximum 999999)

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          Set-LocalUser `
            -Name "runneradmin" `
            -Password $securePass

          "RDP_PASSWORD=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Password set successfully"


      # ============================================================
      # 4. INSTALL NGROK
      # ============================================================
      - name: Install ngrok
        shell: powershell
        run: |

          Write-Host "=============================================="
          Write-Host "        INSTALLING NGROK"
          Write-Host "=============================================="

          $zip = "$env:TEMP\ngrok.zip"
          $extract = "$env:TEMP\ngrok"

          Invoke-WebRequest `
            -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" `
            -OutFile $zip

          Expand-Archive `
            $zip `
            -DestinationPath $extract `
            -Force

          Write-Host "ngrok installed."

          & "$extract\ngrok.exe" version


      # ============================================================
      # 5. START NGROK + DIAGNOSTICS
      # ============================================================
      - name: Start ngrok + Diagnostics
        shell: powershell
        run: |

          $ngrok = "$env:TEMP\ngrok\ngrok.exe"
          $ngrokLog = "$env:TEMP\ngrok.log"

          Write-Host "=============================================="
          Write-Host "        CONFIGURING NGROK"
          Write-Host "=============================================="

          & $ngrok config add-authtoken `
            "${{ secrets.NGROK_AUTH_TOKEN }}"

          Write-Host ""
          Write-Host "ngrok config:"
          & $ngrok config check

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        STARTING NGROK"
          Write-Host "=============================================="

          if (Test-Path $ngrokLog) {
            Remove-Item $ngrokLog -Force
          }

          Start-Process `
            -FilePath $ngrok `
            -ArgumentList "tcp","3389","--log=stdout" `
            -RedirectStandardOutput $ngrokLog `
            -RedirectStandardError $ngrokLog `
            -WindowStyle Hidden

          Write-Host "ngrok process started."

          Write-Host ""
          Write-Host "Waiting for ngrok..."
          Start-Sleep -Seconds 15

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        NGROK PROCESS"
          Write-Host "=============================================="

          Get-Process ngrok -ErrorAction SilentlyContinue |
            Format-Table `
              Id,
              ProcessName,
              StartTime `
              -AutoSize

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        NGROK LOCAL API"
          Write-Host "=============================================="

          try {

            $tunnels = Invoke-RestMethod `
              -Uri "http://127.0.0.1:4040/api/tunnels"

            $tunnels |
              ConvertTo-Json -Depth 10

          }
          catch {

            Write-Host "Could not reach ngrok API."
            Write-Host $_
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        NGROK LOG"
          Write-Host "=============================================="

          if (Test-Path $ngrokLog) {
            Get-Content $ngrokLog -Tail 100
          }
          else {
            Write-Host "ngrok log file was not created."
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        NGROK TUNNEL"
          Write-Host "=============================================="

          try {

            $tunnels = Invoke-RestMethod `
              -Uri "http://127.0.0.1:4040/api/tunnels"

            if ($null -eq $tunnels.tunnels) {
              throw "No tunnels returned by ngrok API."
            }

            if ($tunnels.tunnels.Count -eq 0) {
              throw "ngrok is running but no tunnel exists."
            }

            $tunnel = $tunnels.tunnels[0]

            $addr = $tunnel.public_url `
              -replace "^tcp://",""

            Write-Host ""
            Write-Host "=============================================="
            Write-Host "              RDP DETAILS"
            Write-Host "=============================================="
            Write-Host ""
            Write-Host "Address  : $addr"
            Write-Host "Username : runneradmin"
            Write-Host "Password : $env:RDP_PASSWORD"
            Write-Host ""
            Write-Host "=============================================="
            Write-Host ""

          }
          catch {

            Write-Host ""
            Write-Host "=============================================="
            Write-Host "        NGROK TUNNEL ERROR"
            Write-Host "=============================================="
            Write-Host ""

            Write-Host $_

            Write-Host ""
            Write-Host "Processes:"
            Get-Process ngrok -ErrorAction SilentlyContinue

            Write-Host ""
            Write-Host "Final ngrok log:"
            if (Test-Path $ngrokLog) {
              Get-Content $ngrokLog -Tail 200
            }

            exit 1
          }


      # ============================================================
      # 6. FINAL RDP CONNECTIVITY CHECK
      # ============================================================
      - name: Final RDP Connectivity Check
        shell: powershell
        run: |

          Write-Host "=============================================="
          Write-Host "        FINAL RDP CHECK"
          Write-Host "=============================================="

          Write-Host ""
          Write-Host "TermService:"
          Get-Service TermService

          Write-Host ""
          Write-Host "Port 3389:"
          netstat -ano | findstr ":3389"

          Write-Host ""
          Write-Host "Local TCP test:"
          Test-NetConnection `
            127.0.0.1 `
            -Port 3389

          Write-Host ""
          Write-Host "Firewall rule:"
          netsh advfirewall firewall show rule `
            name="Allow RDP 3389"


      # ============================================================
      # 7. KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep Alive
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        RDP IS RUNNING"
          Write-Host "=============================================="
          Write-Host ""

          while ($true) {

            Write-Host `
              "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP Active"

            Start-Sleep -Seconds 300
          }
